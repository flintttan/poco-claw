name: Docker Images Publish

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            image: ghcr.io/${{ github.repository_owner }}/poco-backend
            dockerfile: docker/backend/Dockerfile
          - name: executor-manager
            image: ghcr.io/${{ github.repository_owner }}/poco-executor-manager
            dockerfile: docker/executor_manager/Dockerfile
          - name: executor-lite
            image: ghcr.io/${{ github.repository_owner }}/poco-executor
            dockerfile: docker/executor/Dockerfile
            sandbox_variant: lite
            tags_suffix: lite
          - name: executor-full
            image: ghcr.io/${{ github.repository_owner }}/poco-executor
            dockerfile: docker/executor/Dockerfile
            sandbox_variant: full
            tags_suffix: full
          - name: frontend
            image: ghcr.io/${{ github.repository_owner }}/poco-frontend
            dockerfile: docker/frontend/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: prep
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.image }}
          TAGS_SUFFIX: ${{ matrix.tags_suffix || '' }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          suffix=""
          if [[ -n "${TAGS_SUFFIX}" ]]; then
            suffix="-${TAGS_SUFFIX}"
          fi

          ref_slug="$(echo "${REF_NAME}" | tr '/:@' '-' | tr -cd '[:alnum:]._-')"
          short_sha="${SHA::12}"

          tags=("${IMAGE_NAME}:sha-${short_sha}${suffix}")

          if [[ "${REF_TYPE}" == "branch" && -n "${ref_slug}" ]]; then
            tags+=("${IMAGE_NAME}:${ref_slug}${suffix}")
          fi

          if [[ "${REF_TYPE}" == "tag" && -n "${ref_slug}" ]]; then
            tags+=("${IMAGE_NAME}:${ref_slug}${suffix}")
          fi

          if [[ "${REF_NAME}" == "${DEFAULT_BRANCH}" || "${REF_NAME}" == v* ]]; then
            tags+=("${IMAGE_NAME}:latest${suffix}")
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.prep.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_UID=1000
            NEXT_PUBLIC_SESSION_POLLING_INTERVAL=2500
            NEXT_PUBLIC_MESSAGE_POLLING_INTERVAL=2500
            SANDBOX_VARIANT=${{ matrix.sandbox_variant || 'lite' }}
